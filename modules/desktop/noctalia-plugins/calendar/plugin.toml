# Upcoming meetings from waybar/polybar/ashell-calendar.sh (gcalcli).
# widget.luau is generated from ../stream-widget.luau by modules/desktop/noctalia.nix.
id = "jevin/calendar"
name = "Calendar meetings"
version = "1.0.0"
# Measured on 5.1.0: noctalia's plugin loader rejects plugin_api outside
# 3-30 ("targets plugin API 1; supported range is 3-30"); 3 is the lowest
# accepted.
plugin_api = 3
author = "jevin"
license = "MIT"
dependencies = []
description = "Next meetings within the hour; turns red within 10 minutes."

[[widget]]
id = "meetings"
entry = "widget.luau"
